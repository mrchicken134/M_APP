[package]
name = "m-app"
version = "0.1.0"
description = "A Tauri desktop application"
authors = ["M App"]
edition = "2021"

[lib]
name = "m_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = "0.24"
opencv = { version = "0.98.2", default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs"] }
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
